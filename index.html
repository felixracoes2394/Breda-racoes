<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4c400"><link rel="manifest" href="manifest.json"><title>Felix Rações - Vendas</title><meta name="application-name" content="Felix Rações">
<style>
:root{--y:#f4c400;--d:#242424;--bg:#f6f1dc;--card:#fffdf4;--muted:#777;--g:#218739;--r:#d83b32}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--d)}header{position:sticky;top:0;z-index:10;background:var(--y);padding:14px;box-shadow:0 2px 8px #0002}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800}.subtitle{font-size:12px;opacity:.75}.iconbtn,.close{border:0;background:#fff8;border-radius:12px;padding:10px;font-size:18px}.search{margin-top:11px;width:100%;padding:13px;border:0;border-radius:14px;font-size:15px}.tabs{display:flex;gap:8px;overflow:auto;padding-top:12px}.tab{border:0;background:#fff8d7;padding:9px 14px;border-radius:999px;white-space:nowrap;font-weight:700}.tab.active{background:var(--d);color:#fff}main{padding:10px 12px 145px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px #0001;position:relative}.photo{height:135px;background:#eee8cc;display:flex;align-items:center;justify-content:center;font-size:58px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;background:#fff}.info{padding:10px}.name{font-weight:800;font-size:15px;min-height:35px}.desc{font-size:11px;color:var(--muted);margin:5px 0}.price{font-size:19px;font-weight:900}.stock{font-size:11px;color:var(--g)}.add{position:absolute;right:9px;bottom:9px;width:39px;height:39px;border:0;border-radius:12px;background:var(--y);font-size:24px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffef7;border-top:1px solid #ddd;padding:10px 12px;z-index:20;box-shadow:0 -3px 15px #0002}.cartline{display:flex;justify-content:space-between}.total{font-size:22px;font-weight:900}.finish{width:100%;margin-top:8px;border:0;border-radius:14px;padding:13px;background:var(--g);color:#fff;font-size:16px;font-weight:900}.secondary{width:100%;margin-top:8px;border:0;border-radius:12px;padding:12px;font-weight:800;background:#eee}.danger{background:#fee;color:#b00000}.panel{display:none;position:fixed;inset:0;background:#0008;z-index:30}.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90vh;background:#fffef7;border-radius:22px 22px 0 0;padding:18px;overflow:auto}.sheet h2{margin:0 0 14px}.row,.saleitem{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid #ddd}.qty button{border:0;background:#eee;border-radius:8px;padding:4px 9px;font-size:16px}.remove{border:0;background:#fee;color:#b00000;border-radius:9px;padding:7px;font-weight:700}.form{display:grid;gap:9px}.form input,.form select{padding:13px;border:1px solid #ccc;border-radius:10px;font-size:15px}.save{border:0;background:var(--y);padding:13px;border-radius:10px;font-weight:800;font-size:15px}.preview{height:150px;border:1px dashed #aaa;border-radius:12px;background:#f4f4f4;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#777;text-align:center}.preview img{width:100%;height:100%;object-fit:contain}.small{font-size:12px;color:#777}.empty{text-align:center;padding:45px 10px;color:#777;grid-column:1/-1}@media(min-width:800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.photo{height:160px}}
</style></head><body>
<header><div class="top"><div><div class="brand">🐶 Felix Rações</div><div class="subtitle">Sistema de vendas</div></div><button class="iconbtn" onclick="menu()">☰</button></div><input id="search" class="search" placeholder="🔎 Procurar produto..." oninput="render()"><div style="display:flex;gap:8px;margin-top:10px"><button onclick="productsPanel()" style="flex:1;border:0;border-radius:12px;padding:11px;background:#242424;color:#fff;font-weight:800">📦 Produtos / Estoque</button><button onclick="salesPanel()" style="flex:1;border:0;border-radius:12px;padding:11px;background:#fff8d7;font-weight:800">📊 Vendas</button></div><div id="tabs" class="tabs"></div></header>
<main><div id="grid" class="grid"></div></main><div class="bottom"><div class="cartline"><b id="cartCount">0 itens</b><b id="cartTotal" class="total">R$ 0,00</b></div><button class="finish" onclick="openCart()">🛒 Ver carrinho / Finalizar venda</button></div>
<div id="panel" class="panel" onclick="if(event.target===this)closePanel()"><div id="sheet" class="sheet"></div></div>
<script>
const KEY='breda_racoes_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{category:'Todos',cart:[],sales:[],products:[{id:1,name:'Ração Magnus Adulto 15kg',price:129.9,stock:10,cat:'Cães',emoji:'🐶',image:'',desc:'Ração para cães adultos'},{id:2,name:'Ração Premier 15kg',price:189.9,stock:6,cat:'Cães',emoji:'🐕',image:'',desc:'Alimento completo'},{id:3,name:'Ração Golden Gatos 10kg',price:119.9,stock:8,cat:'Gatos',emoji:'🐱',image:'',desc:'Para gatos adultos'},{id:4,name:'Ração Granvita 10kg',price:89.9,stock:12,cat:'Cães',emoji:'🐕‍🦺',image:'',desc:'Nutrição diária'},{id:5,name:'Petisco para cães 500g',price:14.9,stock:20,cat:'Petiscos',emoji:'🦴',image:'',desc:'Petisco sabor carne'},{id:6,name:'Areia para gatos 4kg',price:18.9,stock:15,cat:'Gatos',emoji:'🐈',image:'',desc:'Alta absorção'},{id:7,name:'Shampoo Pet 500ml',price:22.9,stock:9,cat:'Higiene',emoji:'🧴',image:'',desc:'Higiene para cães e gatos'},{id:8,name:'Brinquedo para cachorro',price:19.9,stock:7,cat:'Acessórios',emoji:'🎾',image:'',desc:'Diversão para seu pet'}]};
state.products=(state.products||[]).map(p=>({...p,image:p.image||'',emoji:p.emoji||'🐶',desc:p.desc||''}));state.cart=state.cart||[];state.sales=state.sales||[];state.category=state.category||'Todos';
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Não foi possível salvar. O armazenamento está cheio. Tente remover algumas fotos.');return false}}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function cats(){return ['Todos',...new Set(state.products.map(p=>p.cat).filter(Boolean))]}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function ph(p){return p.image?`<img src="${p.image}">`:esc(p.emoji)}
function render(){ $('tabs').innerHTML=cats().map(c=>`<button class="tab ${state.category===c?'active':''}" onclick='state.category=${JSON.stringify(c)};render()'>${esc(c)}</button>`).join('');let q=$('search').value.toLowerCase(),a=state.products.filter(p=>(state.category==='Todos'||p.cat===state.category)&&p.name.toLowerCase().includes(q));$('grid').innerHTML=a.length?a.map(p=>`<div class="card"><div class="photo">${ph(p)}</div><div class="info"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.desc)}</div><div class="price">${money(p.price)}</div><div class="stock">${p.stock>0?'Estoque: '+p.stock:'Sem estoque'}</div></div><button class="add" onclick="add(${p.id})" ${p.stock<=0?'disabled':''}>+</button></div>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>';let c=state.cart.reduce((a,i)=>a+i.qty,0),t=state.cart.reduce((a,i)=>a+i.qty*i.price,0);$('cartCount').textContent=c+' '+(c===1?'item':'itens');$('cartTotal').textContent=money(t);save()}
function add(id){let p=state.products.find(x=>x.id===id);if(!p||p.stock<=0)return;let i=state.cart.find(x=>x.id===id);if(i){if(i.qty>=p.stock)return alert('Quantidade maior que o estoque disponível.');i.qty++}else state.cart.push({id:p.id,name:p.name,price:p.price,qty:1});render()}
function openCart(){let t=state.cart.reduce((a,i)=>a+i.qty*i.price,0);$('sheet').innerHTML=`<button class="close" onclick="closePanel()">✕</button><h2>🛒 Venda atual</h2>${state.cart.length?state.cart.map(i=>`<div class="saleitem"><div><b>${esc(i.name)}</b><br><span class="small">${money(i.price)} cada</span></div><div><div class="qty"><button onclick="change(${i.id},-1)">−</button> ${i.qty} <button onclick="change(${i.id},1)">+</button></div><button class="remove" onclick="removeCart(${i.id})">🗑️ Retirar</button></div></div>`).join(''):'<p>Seu carrinho está vazio.</p>'}<h2 style="text-align:right">${money(t)}</h2>${state.cart.length?`<select id="pay" style="width:100%;padding:13px;border:1px solid #ccc;border-radius:10px"><option>PIX</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option></select><button class="finish" onclick="finishSale()">✓ Finalizar venda</button><button class="secondary danger" onclick="cancelSale()">✕ Cancelar venda inteira</button>`:''}`;openPanel()}
function change(id,d){let i=state.cart.find(x=>x.id===id),p=state.products.find(x=>x.id===id);if(!i)return;if(d>0&&i.qty>=p.stock)return alert('Quantidade maior que o estoque disponível.');i.qty+=d;if(i.qty<=0)state.cart=state.cart.filter(x=>x.id!==id);save();openCart();render()}function removeCart(id){let i=state.cart.find(x=>x.id===id);if(i&&confirm('Retirar este produto da venda?')){state.cart=state.cart.filter(x=>x.id!==id);save();openCart();render()}}function cancelSale(){if(confirm('Cancelar a venda atual inteira?')){state.cart=[];save();closePanel();render()}}
function finishSale(){if(!state.cart.length)return;for(let i of state.cart){let p=state.products.find(x=>x.id===i.id);if(!p||i.qty>p.stock)return alert('Estoque insuficiente para '+i.name)}let pay=$('pay').value;state.cart.forEach(i=>state.products.find(x=>x.id===i.id).stock-=i.qty);state.sales.push({date:new Date().toISOString(),items:state.cart.map(i=>({...i})),payment:pay,total:state.cart.reduce((a,i)=>a+i.qty*i.price,0)});state.cart=[];save();closePanel();render();alert('Venda registrada com sucesso!')}
function openPanel(){ $('panel').style.display='block'}function menu(){$('sheet').innerHTML=`<button class="close" onclick="closePanel()">✕</button><h2>⚙️ Menu</h2><button class="finish" onclick="productsPanel()">📦 Produtos e estoque</button><button class="save" style="width:100%;margin-top:8px" onclick="newProduct()">➕ Cadastrar produto</button><button class="finish" style="margin-top:8px;background:#555" onclick="salesPanel()">📊 Histórico de vendas</button>`;openPanel()}
function productsPanel(){$('sheet').innerHTML=`<button class="close" onclick="closePanel()">✕</button><h2>📦 Produtos / Estoque</h2><button class="save" style="width:100%" onclick="newProduct()">➕ Cadastrar produto</button>${state.products.map(p=>`<div class="row"><div style="display:flex;gap:9px;align-items:center"><div style="width:50px;height:50px;overflow:hidden;border-radius:9px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:25px">${ph(p)}</div><div><b>${esc(p.name)}</b><br>${money(p.price)} • Estoque: ${p.stock}</div></div><button onclick="editProduct(${p.id})">✏️</button></div>`).join('')}`;openPanel()}
function newProduct(){editProduct(null)}
function editProduct(id){let p=id?state.products.find(x=>x.id===id):{name:'',price:'',stock:0,cat:'Cães',emoji:'🐶',image:'',desc:''};$('sheet').innerHTML=`<button class="close" onclick="productsPanel()">✕</button><h2>${id?'Editar':'Novo'} produto</h2><div class="form"><input id="pn" placeholder="Nome do produto" value="${esc(p.name)}"><input id="pp" type="number" step="0.01" inputmode="decimal" placeholder="Preço de venda" value="${p.price}"><input id="ps" type="number" inputmode="numeric" placeholder="Estoque" value="${p.stock}"><select id="pc">${cats().filter(x=>x!=='Todos').map(c=>`<option ${p.cat===c?'selected':''}>${esc(c)}</option>`).join('')}<option ${p.cat==='Outros'?'selected':''}>Outros</option></select><input id="pe" placeholder="Emoji/ícone (opcional)" value="${esc(p.emoji)}"><input id="pd" placeholder="Descrição" value="${esc(p.desc)}"><b>Foto do produto</b><div id="imagePreview" class="preview">${p.image?`<img src="${p.image}">`:'Escolha uma foto da galeria'}</div><input id="photoFile" type="file" accept="image/*" onchange="preparePhoto(this)"><input id="pimg" type="hidden" value="${esc(p.image)}">${p.image?'<button class="secondary" onclick="removePhoto()">🗑️ Remover foto</button>':''}<button class="save" onclick="saveProduct(${id||0})">Salvar produto</button></div>`;openPanel()}
function preparePhoto(input){let f=input.files&&input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{let max=700,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);let d=c.toDataURL('image/jpeg',.72);$('pimg').value=d;$('imagePreview').innerHTML='<img src="'+d+'">'};im.onerror=()=>alert('Não foi possível carregar a foto.');im.src=e.target.result};r.readAsDataURL(f)}
function removePhoto(){$('pimg').value='';$('imagePreview').textContent='Escolha uma foto da galeria'}
function saveProduct(id){let name=$('pn').value.trim(),price=Number($('pp').value),stock=Number($('ps').value),cat=$('pc').value,emoji=$('pe').value.trim()||'🐶',desc=$('pd').value.trim(),image=$('pimg').value||'';if(!name)return alert('Digite o nome do produto.');if(!Number.isFinite(price)||price<0)return alert('Digite um preço válido.');if(!Number.isFinite(stock)||stock<0)return alert('Digite um estoque válido.');let o={id:id||Date.now(),name,price,stock,cat,emoji,image,desc};if(id){let n=state.products.findIndex(x=>x.id===id);if(n<0)return alert('Produto não encontrado.');state.products[n]=o}else state.products.push(o);if(!save())return;productsPanel();render();alert('Produto salvo com sucesso!')}
function today(iso){let d=new Date(iso),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}
function salesPanel(){$('sheet').innerHTML=`<button class="close" onclick="closePanel()">✕</button><h2>📊 Vendas</h2><button class="save" style="width:100%" onclick="monthlyPanel()">📦 Saída mensal por tipo</button><button class="save" style="width:100%;margin-top:8px" onclick="report()">📲 Enviar relatório de hoje pelo WhatsApp</button><p class="small">O relatório diário terá somente nomes e quantidades, sem preços e sem forma de pagamento.</p>${state.sales.length?state.sales.slice().reverse().map((s,r)=>{let idx=state.sales.length-1-r;return `<div class="row"><div><b>${new Date(s.date).toLocaleString('pt-BR')}</b><br>${s.items.reduce((a,i)=>a+i.qty,0)} itens • ${esc(s.payment)}</div><div style="text-align:right"><b>${money(s.total)}</b><br><button class="remove" onclick="reverseSale(${idx})">↩️ Estornar</button></div></div>`}).join(''):'<p>Nenhuma venda registrada.</p>'}`;openPanel()}
function monthlyPanel(){const today=new Date(),months=[];for(let i=0;i<12;i++){const d=new Date(today.getFullYear(),today.getMonth()-i,1);months.push({m:d.getMonth(),y:d.getFullYear(),label:d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})})}$('sheet').innerHTML=`<button class="close" onclick="salesPanel()">✕</button><h2>📦 Saída mensal</h2><select id="monthSelect" style="width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:15px" onchange="showMonthlyReport()">${months.map((x,i)=>`<option value="${x.y}-${x.m}" ${i===0?'selected':''}>${x.label.charAt(0).toUpperCase()+x.label.slice(1)}</option>`).join('')}</select><div id="monthlyResult" style="margin-top:14px"></div>`;openPanel();showMonthlyReport()}
function showMonthlyReport(){const v=$('monthSelect').value.split('-'),year=Number(v[0]),month=Number(v[1]),g={Cães:{},Gatos:{},Demais:{}};state.sales.forEach(s=>{const d=new Date(s.date);if(d.getFullYear()!==year||d.getMonth()!==month)return;s.items.forEach(i=>{const p=state.products.find(x=>x.id===i.id),type=p&&p.cat==='Cães'?'Cães':p&&p.cat==='Gatos'?'Gatos':'Demais';g[type][i.name]=(g[type][i.name]||0)+i.qty})});let total=0,html='';['Cães','Gatos','Demais'].forEach(type=>{const names=Object.keys(g[type]),sub=names.reduce((a,n)=>a+g[type][n],0);total+=sub;html+=`<div style="background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #ddd"><h3 style="margin:0 0 8px">${type==='Cães'?'🐶':type==='Gatos'?'🐱':'📦'} ${type}</h3>${names.length?names.map(n=>`<div class="row"><span>${esc(n)}</span><b>${g[type][n]} un.</b></div>`).join(''):'<div class="small">Nenhuma saída.</div>'}<div style="text-align:right;font-weight:800;margin-top:8px">Total ${type}: ${sub} un.</div></div>`});html+=`<div style="font-size:18px;font-weight:900;text-align:right;padding:8px">📦 TOTAL GERAL: ${total} unidades</div><button class="save" style="width:100%;margin-top:8px" onclick="sendMonthlyWhatsApp(${year},${month})">📲 Enviar este mês pelo WhatsApp</button>`;$('monthlyResult').innerHTML=html}
function sendMonthlyWhatsApp(year,month){const g={Cães:{},Gatos:{},Demais:{}};state.sales.forEach(s=>{const d=new Date(s.date);if(d.getFullYear()!==year||d.getMonth()!==month)return;s.items.forEach(i=>{const p=state.products.find(x=>x.id===i.id),type=p&&p.cat==='Cães'?'Cães':p&&p.cat==='Gatos'?'Gatos':'Demais';g[type][i.name]=(g[type][i.name]||0)+i.qty})});const label=new Date(year,month,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let msg='📦 SAÍDA MENSAL - FELIX RAÇÕES\n📅 '+label+'\n\n',total=0;[['Cães','🐶'],['Gatos','🐱'],['Demais','📦']].forEach(([type,icon])=>{msg+=icon+' '+type.toUpperCase()+'\n';const names=Object.keys(g[type]);if(!names.length)msg+='Nenhuma saída.\n';names.forEach(n=>{msg+='• '+n+' — '+g[type][n]+' un.\n';total+=g[type][n]});msg+='\n'});msg+='TOTAL GERAL: '+total+' unidades';window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}
function reverseSale(i){let s=state.sales[i];if(!s)return;if(!confirm('Estornar esta venda? O estoque será restaurado e ela sairá do histórico.'))return;s.items.forEach(x=>{let p=state.products.find(p=>p.id===x.id);if(p)p.stock+=x.qty});state.sales.splice(i,1);save();salesPanel();render()}
function report(){let ss=state.sales.filter(s=>today(s.date)),t={};ss.forEach(s=>s.items.forEach(i=>t[i.name]=(t[i.name]||0)+i.qty));let ns=Object.keys(t);if(!ns.length)return alert('Ainda não há vendas registradas hoje.');let msg='📦 RELATÓRIO DE VENDAS - FELIX RAÇÕES\n📅 '+new Date().toLocaleDateString('pt-BR')+'\n\n';ns.forEach(n=>msg+='• '+n+' — '+t[n]+' un.\n');msg+='\nTotal de itens: '+ns.reduce((a,n)=>a+t[n],0);window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}
function closePanel(){$('panel').style.display='none'}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
